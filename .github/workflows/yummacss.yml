# Moves the docs to the latest Yumma CSS and merges it once the checks pass.
# Dependabot stopped opening these; a run here fails in plain sight. See the notes.
name: Yumma CSS updates
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm upd

      - name: Read the new version
        id: version
        run: |
          if git diff --quiet; then exit 0; fi
          echo "version=$(node -p 'require("./apps/yummacss.com/node_modules/yummacss/package.json").version')" >> "$GITHUB_OUTPUT"

      # the types and the class tests check the site against the new version
      - if: steps.version.outputs.version
        run: pnpm check-types && pnpm test

      - if: steps.version.outputs.version
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/yummacss-${{ steps.version.outputs.version }}
          commit-message: Docs on Yumma CSS ${{ steps.version.outputs.version }}
          title: Docs on Yumma CSS ${{ steps.version.outputs.version }}
          body: Moves the docs to Yumma CSS ${{ steps.version.outputs.version }}. The type check and the class tests pass on it.
          labels: dependencies

      - if: steps.pr.outputs.pull-request-number
        run: gh pr merge --squash --delete-branch "$PR"
        env:
          PR: ${{ steps.pr.outputs.pull-request-number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
