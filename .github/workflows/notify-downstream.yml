name: Notify Downstream Repositories

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to dispatch (e.g. v3.20.7)"
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - yummacss/docs
          - yummacss/play
          - yummacss/intellisense-vscode

    steps:
      - name: Trigger update in ${{ matrix.repo }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            const version = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.version
              : context.payload.release.tag_name;

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: '${{ matrix.repo }}'.split('/')[1],
              event_type: 'yummacss-released',
              client_payload: { version }
            });