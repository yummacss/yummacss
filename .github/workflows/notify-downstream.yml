name: Notify Downstream Repositories

on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to dispatch (e.g. v3.20.7)"
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        repo:
          - yummacss/docs
          - yummacss/play

    steps:
      - name: Get version
        id: version
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            if (context.eventName === 'workflow_dispatch') {
              return context.payload.inputs.version;
            }

            const release = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            return release.data.tag_name;
          result-encoding: string

      - name: Trigger update in ${{ matrix.repo }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: '${{ matrix.repo }}'.split('/')[1],
              event_type: 'yummacss-released',
              client_payload: { version: '${{ steps.version.outputs.result }}' }
            });