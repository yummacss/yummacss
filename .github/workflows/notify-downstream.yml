name: Notify Downstream Repos

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - yummacss/docs
          - yummacss/playground
          - yummacss/intellisense-vscode

    steps:
      - name: Trigger update in ${{ matrix.repo }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: '${{ matrix.repo }}'.split('/')[1],
              event_type: 'yummacss-released',
              client_payload: {
                version: context.payload.release.tag_name
              }
            });